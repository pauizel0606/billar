<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎱 Billar 8-Ball</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    color: white;
    background:
        radial-gradient(circle at 20% 20%, #29114d 0, transparent 35%),
        radial-gradient(circle at 80% 80%, #17104a 0, transparent 35%),
        #080611;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.app {
    width: min(1200px, 100%);
}

/* =========================
   MENÚ
========================= */

.menu {
    text-align: center;
}

.menu h1 {
    font-size: clamp(38px, 7vw, 70px);
    margin: 0;
    background: linear-gradient(90deg, #ffffff, #c89cff);
    -webkit-background-clip: text;
    color: transparent;
}

.menu p {
    color: #aaa4bb;
    margin: 10px 0 35px;
}

.tables {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
    max-width: 700px;
    margin: auto;
}

.table-option {
    min-height: 150px;
    border: 1px solid #373044;
    border-radius: 22px;
    background: rgba(25, 21, 38, .85);
    color: white;
    cursor: pointer;
    padding: 15px;
    transition: .2s;
}

.table-option:hover {
    transform: translateY(-4px);
    border-color: #9c63ff;
}

.preview {
    width: 100%;
    height: 85px;
    border-radius: 12px;
    border: 8px solid #4b2b17;
    position: relative;
    box-shadow: inset 0 0 20px #000;
}

.preview::before {
    content: "";
    position: absolute;
    inset: 8px;
    border: 2px solid rgba(255,255,255,.15);
}

.green {
    background: #126b3b;
}

.blue {
    background: #145a87;
}

.purple {
    background: #612e78;
}

.black {
    background: #20252b;
}

.table-name {
    margin-top: 12px;
    font-size: 17px;
    font-weight: bold;
}

/* =========================
   JUEGO
========================= */

.game {
    display: none;
}

.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 12px;
}

.info {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.badge {
    background: #191526;
    border: 1px solid #352d48;
    padding: 9px 13px;
    border-radius: 20px;
    font-size: 14px;
}

button {
    font-family: inherit;
}

.action {
    border: 0;
    border-radius: 12px;
    padding: 11px 16px;
    color: white;
    background: #29233a;
    cursor: pointer;
    font-weight: bold;
}

.action:hover {
    background: #3b3151;
}

#canvasWrapper {
    width: 100%;
    position: relative;
}

canvas {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 20px;
    touch-action: none;
    user-select: none;
    box-shadow:
        0 20px 70px rgba(0,0,0,.5),
        0 0 40px rgba(125,70,255,.08);
}

.controls {
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 10px;
    margin-top: 12px;
}

.power-container {
    height: 48px;
    border-radius: 13px;
    background: #13101d;
    border: 1px solid #30283f;
    padding: 14px;
    display: flex;
    align-items: center;
}

.power {
    width: 0%;
    height: 9px;
    border-radius: 10px;
    background: linear-gradient(90deg, #7c3aed, #d8b4fe);
}

.shoot {
    min-width: 110px;
    border: 0;
    border-radius: 13px;
    color: white;
    background: linear-gradient(135deg, #7136d9, #a855f7);
    font-weight: bold;
    cursor: pointer;
}

.reset {
    border: 0;
    border-radius: 13px;
    padding: 0 18px;
    color: white;
    background: #25202f;
    cursor: pointer;
}

.help {
    text-align: center;
    color: #888297;
    font-size: 13px;
    margin-top: 12px;
}

/* =========================
   MOBILE
========================= */

@media(max-width: 650px) {

    body {
        padding: 10px;
        align-items: flex-start;
    }

    .tables {
        grid-template-columns: 1fr;
    }

    .topbar {
        margin-top: 5px;
    }

    .controls {
        grid-template-columns: 1fr 1fr;
    }

    .power-container {
        grid-column: 1 / -1;
    }

    .shoot,
    .reset {
        min-height: 48px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- =========================
         MENÚ
    ========================== -->

    <div class="menu" id="menu">

        <h1>🎱 BILLAR</h1>

        <p>
            8-Ball Pool · Elige tu mesa
        </p>

        <div class="tables">

            <button class="table-option" onclick="selectTable('#126b3b')">
                <div class="preview green"></div>
                <div class="table-name">Mesa clásica</div>
            </button>

            <button class="table-option" onclick="selectTable('#145a87')">
                <div class="preview blue"></div>
                <div class="table-name">Mesa océano</div>
            </button>

            <button class="table-option" onclick="selectTable('#612e78')">
                <div class="preview purple"></div>
                <div class="table-name">Mesa violeta</div>
            </button>

            <button class="table-option" onclick="selectTable('#20252b')">
                <div class="preview black"></div>
                <div class="table-name">Black Edition</div>
            </button>

        </div>

    </div>


    <!-- =========================
         JUEGO
    ========================== -->

    <div class="game" id="game">

        <div class="topbar">

            <div class="info">

                <div class="badge" id="turn">
                    🎯 Turno: Jugador 1
                </div>

                <div class="badge" id="status">
                    Mesa abierta
                </div>

            </div>

            <button class="action" onclick="backMenu()">
                ← Menú
            </button>

        </div>

        <div id="canvasWrapper">

            <canvas
                id="canvas"
                width="1100"
                height="620">
            </canvas>

        </div>

        <div class="controls">

            <div class="power-container">
                <div class="power" id="power"></div>
            </div>

            <button class="shoot" onclick="shoot()">
                🎱 TIRAR
            </button>

            <button class="reset" onclick="newGame()">
                ↻ Reiniciar
            </button>

        </div>

        <div class="help">
            🖱️ / 📱 Pulsa sobre la bola blanca y arrastra hacia atrás para apuntar y elegir potencia.
        </div>

    </div>

</div>


<script>

/* =====================================================
   CONFIGURACIÓN
===================================================== */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const menu = document.getElementById("menu");
const game = document.getElementById("game");

const turnText = document.getElementById("turn");
const statusText = document.getElementById("status");
const powerBar = document.getElementById("power");

const WIDTH = 1100;
const HEIGHT = 620;

const TABLE_LEFT = 55;
const TABLE_RIGHT = 1045;
const TABLE_TOP = 55;
const TABLE_BOTTOM = 565;

const BALL_RADIUS = 13;

let tableColor = "#126b3b";

let balls = [];

let player = 1;

let moving = false;

let aiming = false;

let aimPoint = {
    x: 0,
    y: 0
};

let dragPoint = {
    x: 0,
    y: 0
};

let shotPower = 0;

let gameFinished = false;

let openTable = true;

let groups = {
    1: null,
    2: null
};

let foul = false;


/* =====================================================
   AGUJEROS
===================================================== */

const pockets = [

    {
        x: TABLE_LEFT,
        y: TABLE_TOP
    },

    {
        x: WIDTH / 2,
        y: TABLE_TOP - 6
    },

    {
        x: TABLE_RIGHT,
        y: TABLE_TOP
    },

    {
        x: TABLE_LEFT,
        y: TABLE_BOTTOM
    },

    {
        x: WIDTH / 2,
        y: TABLE_BOTTOM + 6
    },

    {
        x: TABLE_RIGHT,
        y: TABLE_BOTTOM
    }

];


/* =====================================================
   COLORES DE BOLAS
===================================================== */

const ballColors = {

    1: "#f4d03f",
    2: "#2467d8",
    3: "#d83b3b",
    4: "#703bb8",
    5: "#ed8b22",
    6: "#34a853",
    7: "#8e2222",

    8: "#111111",

    9: "#f4d03f",
    10: "#2467d8",
    11: "#d83b3b",
    12: "#703bb8",
    13: "#ed8b22",
    14: "#34a853",
    15: "#8e2222"

};


/* =====================================================
   SELECCIONAR MESA
===================================================== */

function selectTable(color) {

    tableColor = color;

    menu.style.display = "none";

    game.style.display = "block";

    newGame();

}


/* =====================================================
   VOLVER AL MENÚ
===================================================== */

function backMenu() {

    moving = false;
    aiming = false;

    game.style.display = "none";

    menu.style.display = "block";

}


/* =====================================================
   CREAR PARTIDA
===================================================== */

function newGame() {

    balls = [];

    player = 1;

    moving = false;

    aiming = false;

    gameFinished = false;

    openTable = true;

    foul = false;

    groups = {
        1: null,
        2: null
    };

    shotPower = 0;

    powerBar.style.width = "0%";


    /* Bola blanca */

    balls.push({

        number: 0,

        type: "cue",

        x: 800,

        y: 310,

        vx: 0,

        vy: 0,

        pocketed: false

    });


    /*
        Triángulo de bolas.
    */

    const rack = [
        1,
        10,
        2,
        11,
        8,
        12,
        3,
        9,
        4,
        13,
        5,
        14,
        6,
        15,
        7
    ];


    let index = 0;

    const startX = 300;

    const startY = 310;

    const horizontalDistance = 23;

    const verticalDistance = 20;


    for (let row = 0; row < 5; row++) {

        for (let column = 0; column <= row; column++) {

            const number = rack[index++];

            const x =
                startX +
                row * horizontalDistance;

            const y =
                startY +
                (column - row / 2) *
                verticalDistance;


            balls.push({

                number: number,

                type:
                    number === 8
                        ? "eight"
                        : number <= 7
                            ? "solid"
                            : "stripe",

                x: x,

                y: y,

                vx: 0,

                vy: 0,

                pocketed: false

            });

        }

    }


    updateUI();

    draw();

}


/* =====================================================
   UTILIDADES
===================================================== */

function distance(a, b) {

    return Math.hypot(
        a.x - b.x,
        a.y - b.y
    );

}


function getCueBall() {

    return balls.find(
        b => b.type === "cue"
    );

}


function getMousePosition(event) {

    const rect =
        canvas.getBoundingClientRect();


    return {

        x:
            (event.clientX - rect.left) *
            WIDTH /
            rect.width,

        y:
            (event.clientY - rect.top) *
            HEIGHT /
            rect.height

    };

}


/* =====================================================
   INTERFAZ
===================================================== */

function updateUI() {

    if (gameFinished) {

        turnText.textContent =
            "🏆 Partida terminada";

        return;

    }


    turnText.textContent =
        "🎯 Turno: Jugador " + player;


    if (openTable) {

        statusText.textContent =
            "Mesa abierta";

    } else {

        statusText.textContent =
            "J1: " +
            (groups[1] || "—") +
            " · J2: " +
            (groups[2] || "—");

    }

}


/* =====================================================
   DIBUJAR MESA
===================================================== */

function draw() {

    ctx.clearRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );


    /*
        Madera exterior
    */

    const woodGradient =
        ctx.createLinearGradient(
            0,
            0,
            WIDTH,
            HEIGHT
        );

    woodGradient.addColorStop(
        0,
        "#704321"
    );

    woodGradient.addColorStop(
        .5,
        "#3c2414"
    );

    woodGradient.addColorStop(
        1,
        "#21130a"
    );

    ctx.fillStyle = woodGradient;

    ctx.fillRect(
        18,
        18,
        WIDTH - 36,
        HEIGHT - 36
    );


    /*
        Paño
    */

    ctx.fillStyle = tableColor;

    ctx.fillRect(
        TABLE_LEFT,
        TABLE_TOP,
        TABLE_RIGHT - TABLE_LEFT,
        TABLE_BOTTOM - TABLE_TOP
    );


    /*
        Línea interior
    */

    ctx.strokeStyle =
        "rgba(255,255,255,.12)";

    ctx.lineWidth = 2;

    ctx.strokeRect(
        TABLE_LEFT + 10,
        TABLE_TOP + 10,
        TABLE_RIGHT - TABLE_LEFT - 20,
        TABLE_BOTTOM - TABLE_TOP - 20
    );


    /*
        Agujeros
    */

    for (const pocket of pockets) {

        ctx.beginPath();

        ctx.arc(
            pocket.x,
            pocket.y,
            24,
            0,
            Math.PI * 2
        );

        ctx.fillStyle = "#050505";

        ctx.fill();

        ctx.strokeStyle = "#111";

        ctx.lineWidth = 3;

        ctx.stroke();

    }


    /*
        Bolas
    */

    for (const ball of balls) {

        if (ball.pocketed)
            continue;


        drawBall(ball);

    }


    /*
        Línea de apuntado
    */

    if (
        aiming &&
        !moving &&
        !gameFinished
    ) {

        const cue = getCueBall();

        if (
            cue &&
            !cue.pocketed
        ) {

            const dx =
                cue.x -
                dragPoint.x;

            const dy =
                cue.y -
                dragPoint.y;


            const length =
                Math.hypot(dx, dy);


            if (length > 0) {

                const nx = dx / length;

                const ny = dy / length;


                ctx.save();

                ctx.setLineDash([
                    9,
                    9
                ]);

                ctx.strokeStyle =
                    "rgba(255,255,255,.8)";

                ctx.lineWidth = 2;


                ctx.beginPath();

                ctx.moveTo(
                    cue.x,
                    cue.y
                );

                ctx.lineTo(
                    cue.x + nx * 500,
                    cue.y + ny * 500
                );

                ctx.stroke();


                ctx.restore();

            }

        }

    }

}


/* =====================================================
   DIBUJAR BOLA
===================================================== */

function drawBall(ball) {

    const color =
        ball.number === 0
            ? "#ffffff"
            : ballColors[ball.number];


    /*
        Sombra
    */

    ctx.beginPath();

    ctx.arc(
        ball.x + 2,
        ball.y + 3,
        BALL_RADIUS,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "rgba(0,0,0,.35)";

    ctx.fill();


    /*
        Bola
    */

    ctx.beginPath();

    ctx.arc(
        ball.x,
        ball.y,
        BALL_RADIUS,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        ball.type === "stripe"
            ? "#f5f5f5"
            : color;

    ctx.fill();


    /*
        Franja
    */

    if (ball.type === "stripe") {

        ctx.save();

        ctx.beginPath();

        ctx.arc(
            ball.x,
            ball.y,
            BALL_RADIUS - 1,
            0,
            Math.PI * 2
        );

        ctx.clip();

        ctx.fillStyle =
            ballColors[ball.number];

        ctx.fillRect(
            ball.x - BALL_RADIUS,
            ball.y - 5,
            BALL_RADIUS * 2,
            10
        );

        ctx.restore();

    }


    /*
        Borde
    */

    ctx.beginPath();

    ctx.arc(
        ball.x,
        ball.y,
        BALL_RADIUS,
        0,
        Math.PI * 2
    );

    ctx.strokeStyle =
        "#111";

    ctx.lineWidth = 1.5;

    ctx.stroke();


    /*
        Número
    */

    if (ball.number !== 0) {

        ctx.fillStyle =
            ball.number === 8
                ? "white"
                : "#111";

        ctx.font =
            "bold 8px Arial";

        ctx.textAlign =
            "center";

        ctx.textBaseline =
            "middle";

        ctx.fillText(
            ball.number,
            ball.x,
            ball.y
        );

    }

}


/* =====================================================
   APUNTAR
===================================================== */

canvas.addEventListener(
    "pointerdown",
    function(event) {

        if (moving || gameFinished)
            return;


        const point =
            getMousePosition(event);

        const cue =
            getCueBall();


        if (
            !cue ||
            cue.pocketed
        )
            return;


        const d =
            Math.hypot(
                point.x - cue.x,
                point.y - cue.y
            );


        if (d < 45) {

            aiming = true;

            aimPoint = point;

            dragPoint = point;

            canvas.setPointerCapture(
                event.pointerId
            );

        }

    }
);


/* =====================================================
   ARRASTRAR
===================================================== */

canvas.addEventListener(
    "pointermove",
    function(event) {

        if (!aiming)
            return;


        dragPoint =
            getMousePosition(event);


        const cue =
            getCueBall();


        if (!cue)
            return;


        const d =
            Math.hypot(
                cue.x - dragPoint.x,
                cue.y - dragPoint.y
            );


        shotPower =
            Math.min(
                100,
                d * 2
            );


        powerBar.style.width =
            shotPower + "%";


        draw();

    }
);


/* =====================================================
   SOLTAR
===================================================== */

canvas.addEventListener(
    "pointerup",
    function(event) {

        if (!aiming)
            return;


        dragPoint =
            getMousePosition(event);


        shoot();

    }
);


/* =====================================================
   DISPARO
===================================================== */

function shoot() {

    if (
        moving ||
        gameFinished
    )
        return;


    const cue =
        getCueBall();


    if (
        !cue ||
        cue.pocketed
    )
        return;


    const dx =
        cue.x -
        dragPoint.x;


    const dy =
        cue.y -
        dragPoint.y;


    const length =
        Math.hypot(dx, dy);


    if (length < 5) {

        aiming = false;

        return;

    }


    /*
        Potencia física.
    */

    const power =
        Math.min(
            32,
            length * 0.16
        );


    cue.vx =
        (dx / length) *
        power;


    cue.vy =
        (dy / length) *
        power;


    moving = true;

    aiming = false;

    foul = false;

    powerBar.style.width =
        "0%";


    requestAnimationFrame(
        physicsLoop
    );

}


/* =====================================================
   FÍSICA
===================================================== */

function physicsLoop() {

    let active = false;


    /*
        Movimiento
    */

    for (const ball of balls) {

        if (ball.pocketed)
            continue;


        ball.x += ball.vx;

        ball.y += ball.vy;


        /*
            Fricción
        */

        ball.vx *= 0.991;

        ball.vy *= 0.991;


        /*
            Parar velocidades pequeñas
        */

        if (
            Math.abs(ball.vx) < 0.025
        )
            ball.vx = 0;


        if (
            Math.abs(ball.vy) < 0.025
        )
            ball.vy = 0;


        if (
            Math.abs(ball.vx) > 0 ||
            Math.abs(ball.vy) > 0
        ) {

            active = true;

        }


        /*
            Bandas
        */

        if (
            ball.x -
            BALL_RADIUS <
            TABLE_LEFT
        ) {

            ball.x =
                TABLE_LEFT +
                BALL_RADIUS;

            ball.vx =
                Math.abs(ball.vx) *
                0.88;

        }


        if (
            ball.x +
            BALL_RADIUS >
            TABLE_RIGHT
        ) {

            ball.x =
                TABLE_RIGHT -
                BALL_RADIUS;

            ball.vx =
                -Math.abs(ball.vx) *
                0.88;

        }


        if (
            ball.y -
            BALL_RADIUS <
            TABLE_TOP
        ) {

            ball.y =
                TABLE_TOP +
                BALL_RADIUS;

            ball.vy =
                Math.abs(ball.vy) *
                0.88;

        }


        if (
            ball.y +
            BALL_RADIUS >
            TABLE_BOTTOM
        ) {

            ball.y =
                TABLE_BOTTOM -
                BALL_RADIUS;

            ball.vy =
                -Math.abs(ball.vy) *
                0.88;

        }


        /*
            Agujeros
        */

        for (const pocket of pockets) {

            const d =
                Math.hypot(
                    ball.x - pocket.x,
                    ball.y - pocket.y
                );


            if (d < 22) {

                ball.pocketed = true;

                ball.vx = 0;

                ball.vy = 0;

                active = false;


                if (
                    ball.type === "cue"
                ) {

                    foul = true;

                }

            }

        }

    }


    /*
        Colisiones entre bolas
    */

    for (
        let i = 0;
        i < balls.length;
        i++
    ) {

        for (
            let j = i + 1;
            j < balls.length;
            j++
        ) {

            const a = balls[i];

            const b = balls[j];


            if (
                a.pocketed ||
                b.pocketed
            )
                continue;


            const dx =
                b.x - a.x;

            const dy =
                b.y - a.y;


            const d =
                Math.hypot(
                    dx,
                    dy
                );


            const minimum =
                BALL_RADIUS * 2;


            if (
                d > 0 &&
                d < minimum
            ) {

                const nx =
                    dx / d;

                const ny =
                    dy / d;


                /*
                    Separar bolas
                */

                const overlap =
                    minimum - d;


                a.x -=
                    nx *
                    overlap /
                    2;


                a.y -=
                    ny *
                    overlap /
                    2;


                b.x +=
                    nx *
                    overlap /
                    2;


                b.y +=
                    ny *
                    overlap /
                    2;


                /*
                    Velocidad relativa
                */

                const relativeX =
                    b.vx -
                    a.vx;


                const relativeY =
                    b.vy -
                    a.vy;


                const velocityAlongNormal =
                    relativeX * nx +
                    relativeY * ny;


                if (
                    velocityAlongNormal < 0
                ) {

                    /*
                        Colisión aproximadamente
                        elástica.
                    */

                    const impulse =
                        -velocityAlongNormal;


                    a.vx -=
                        impulse * nx;


                    a.vy -=
                        impulse * ny;


                    b.vx +=
                        impulse * nx;


                    b.vy +=
                        impulse * ny;


                    active = true;

                }

            }

        }

    }


    draw();


    if (active) {

        requestAnimationFrame(
            physicsLoop
        );

    } else {

        moving = false;

        finishShot();

    }

}


/* =====================================================
   FINAL DEL TIRO
===================================================== */

function finishShot() {

    const cue =
        getCueBall();


    /*
        Falta
    */

    if (foul) {

        if (cue) {

            cue.pocketed = false;

            cue.x = 800;

            cue.y = 310;

            cue.vx = 0;

            cue.vy = 0;

        }


        player =
            player === 1
                ? 2
                : 1;


        statusText.textContent =
            "⚠️ Falta · bola blanca";

        updateUI();

        draw();

        return;

    }


    /*
        Bolas metidas
    */

    const pocketed =
        balls.filter(
            b =>
                b.pocketed &&
                b.number !== 0
        );


    /*
        Primera bola de color
    */

    if (openTable) {

        const colored =
            pocketed.find(
                b =>
                    b.type === "solid" ||
                    b.type === "stripe"
            );


        if (colored) {

            const group =
                colored.type;


            groups[player] =
                group;


            groups[
                player === 1
                    ? 2
                    : 1
            ] =
                group === "solid"
                    ? "stripe"
                    : "solid";


            openTable = false;

        }

    }


    /*
        Bola 8
    */

    const eight =
        balls.find(
            b => b.type === "eight"
        );


    if (
        eight &&
        eight.pocketed
    ) {

        gameFinished = true;


        statusText.textContent =
            "🎱 Jugador " +
            player +
            " gana";


        updateUI();

        draw();

        return;

    }


    /*
        Si no ha metido ninguna,
        cambia el turno.
    */

    if (
        pocketed.length === 0
    ) {

        player =
            player === 1
                ? 2
                : 1;

    }


    updateUI();

    draw();

}


/* =====================================================
   ADAPTACIÓN DE CANVAS
===================================================== */

function resizeCanvas() {

    const width =
        canvas.parentElement
            .clientWidth;


    canvas.style.width =
        width + "px";


    canvas.style.height =
        (width * HEIGHT / WIDTH) +
        "px";

}


window.addEventListener(
    "resize",
    resizeCanvas
);


resizeCanvas();


/* =====================================================
   INICIO
===================================================== */

draw();

</script>
